mysql:
  host: "localhost"
  port: 3306
  user: "root"
  database: "tiktok"
  charset: "utf8"
  parse_time: true
  loc: "Local"

redis:
  host: "localhost"
  port: 6379
  database: 0

api:
  # 支持 openAI 规范
  base_url: "your_base_url"

filepath:
  video_path: "./videos/"
  avatar_path: "./avatars/"
  env_path: "./.env"

log:
  level: "info"
  path: "./logs/"

qi:
  bucket: "your_bucket_name"
  domain: "http://your-qiniu-domain.com"

mcp:
  # mcp client配置，可以同时配置多个mcp client
  clients:
  - id: ""
    name: ""
    connection_type: ""
    url: ""                  # HTTP/SSE模式时使用，如 "http://localhost:8080/mcp"
    command: ""              # STDIO模式时使用，MCP服务器可执行文件路径
    args: []
    tools_to_execute: ["*"]
    tools_to_auto_execute: ["*"]
  tool_manager:
    tool_execution_timeout: 200
    max_agent_depth: 10
