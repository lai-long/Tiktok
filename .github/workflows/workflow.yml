name: CI/CD
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: SetUp Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run golang CI
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          args: --timeout=5m

  codeql:
    name: Code Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
      - name: Initialize
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality
      - name: Build
        run: go build ./...
      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"
          upload: true
          output: codeql-results.sarif
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.26.1' ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
