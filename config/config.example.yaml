mysql:
  host: "localhost"
  port: 3306
  user: "root"
  database: "tiktok"
  charset: "utf8"
  parse_time: true
  loc: "Local"
  # 连接池配置(超出 DB 端 max_connections 时调小)
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

redis:
  host: "localhost"
  port: "6379"
  password: "your_redis_password"
  db: 0
  # 连接池配置
  pool_size: 50
  min_idle_conns: 10
  max_idle_conns: 10
  pool_timeout: 4s
  conn_max_idle_time: 5m
  conn_max_lifetime: 30m

api:
  base_url: "your_base_url"
  model: "your_model_name"

filepath:
  video_path: "./videos/"
  avatar_path: "./avatars/"
  env_path: "./.env"

log:
  level: "info"
  path: "./logs/"

qi:
  bucket: "your_bucket_name"
  domain: "http://your-qiniu-domain.com"

mcp:
  clients:
  - id: "mcp_client_1"
    name: "mcp"
    connection_type: "stdio"
    command: "./mcp_service/mcp_service"
    args: []
    tools_to_execute: ["*"]
    tools_to_auto_execute: ["*"]
  tool_manager:
    tool_execution_timeout: 200
    max_agent_depth: 10
